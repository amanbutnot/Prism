name: Build
on:
  push:
  pull_request:

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"
      - name: Build
        run: ./gradlew build
